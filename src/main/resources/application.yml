spring:
  application:
    name: lexpipeline
  mvc:
    problemdetails:
      # Framework-level errors (415, 405, malformed request) answer in problem+json too, so a
      # client never has to parse two different error shapes.
      enabled: true

# Every setting is overridable by env var so the container needs no rebuild to be reconfigured.
app:
  xsd-path: ${APP_XSD_PATH:classpath:schema/judgment.xsd}
  xslt-path: ${APP_XSLT_PATH:classpath:xslt/}    # directory: one stylesheet per artifact
  output-dir: ${APP_OUTPUT_DIR:./data/out}       # published/ and quarantine/ live here
  input-dir: ${APP_INPUT_DIR:./data/in}          # batch scans here, and nowhere above it
  concurrency: ${APP_CONCURRENCY:4}              # worker threads
  queue-capacity: ${APP_QUEUE_CAPACITY:64}       # documents allowed to wait; full means block
  max-doc-bytes: ${APP_MAX_DOC_BYTES:10485760}   # 10 MiB

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        # Health for liveness, metrics/prometheus for the pipeline counters and timers
        # added in later phases (documents_published_total, pipeline_stage_duration_seconds).
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
