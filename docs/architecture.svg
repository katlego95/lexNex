<text x="266" y="286" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Dedupe</text>
<text x="266" y="306" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">id + SHA-256</text>
