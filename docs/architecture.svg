<text x="340" y="176" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Bounded queue + workers</text>

<line x1="340" y1="194" x2="340" y2="230" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

